# ==============================================================================
# Render Blueprint (Alternativa ao deploy via Docker Hub + Existing Image)
#
# No fluxo principal documentado em DEPLOY.md:
#   - Banco de Dados: Neon.tech (PostgreSQL gratuito e permanente)
#   - Backend: Render Web Service via "Existing Image" (Docker Hub)
#   - Frontend: Vercel (Next.js)
#   - CI/CD: .github/workflows/ci-cd.yml
# ==============================================================================

services:
  - type: web
    name: atlantica-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ATLANTICA_REVENDEDORA_URL
        value: https://loja.atlanticanatural.com.br/valescareis
