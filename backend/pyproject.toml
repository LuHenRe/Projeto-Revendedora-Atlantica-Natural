[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine-virtual-backend"
version = "1.0.0"
description = "Backend para o Hub Híbrido de Curadoria"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
